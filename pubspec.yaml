name: period_tracker
description: A fully offline, cross-platform cycle tracker for period, conception, and pregnancy.
publish_to: 'none'
version: 1.2.7+17

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # UI
  table_calendar: ^3.1.1
  fl_chart: ^0.66.2
  flutter_svg: ^2.0.10+1

  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  permission_handler: ^11.3.0

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  share_plus: ^10.0.2
  file_picker: ^8.1.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#F87CA0"
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#F87CA0"
    theme_color: "#F87CA0"
